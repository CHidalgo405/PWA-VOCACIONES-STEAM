<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <title>Vocaciones STEAM</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="PWA de orientación vocacional STEAM para explorar perfiles, carreras, simuladores y universidades cercanas.">
  <meta name="theme-color" content="#07B1C9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vocaciones STEAM">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <script>
    // Anti-FOUC: Apply saved theme before Angular renders
    (function() {
      var theme = localStorage.getItem('theme-preference');
      if (theme === 'dark') {
        document.body.classList.add('dark-theme');
      }
    })();
  </script>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
