<div class="page-container">
  <app-header title="Contraseña y Seguridad" [showBack]="true" backRoute="/profile"></app-header>

  <div class="page-content">
    <div class="manage-profile-wrapper">
      
      <!-- SECCIÓN 1: CAMBIAR CONTRASEÑA -->
      <form (ngSubmit)="savePassword()" #pwdForm="ngForm" class="form-section">
        <h3 class="section-title">Cambiar Contraseña</h3>
        <div class="ios-form-group">
          <div class="ios-input-row border-bottom">
            <div class="row-icon"><app-lucide-icon name="unlock" [size]="18"></app-lucide-icon></div>
            <input type="password" name="currentPassword" [(ngModel)]="passwordForm.currentPassword" required placeholder="Contraseña actual">
          </div>
          <div class="ios-input-row border-bottom">
            <div class="row-icon"><app-lucide-icon name="lock" [size]="18"></app-lucide-icon></div>
            <input type="password" name="newPassword" [(ngModel)]="passwordForm.newPassword" required minlength="8" placeholder="Nueva contraseña">
          </div>
          <div class="ios-input-row">
            <div class="row-icon" [class.success]="passwordForm.newPassword && passwordForm.newPassword === passwordForm.confirmPassword">
              <app-lucide-icon name="check-circle" [size]="18"></app-lucide-icon>
            </div>
            <input type="password" name="confirmPassword" [(ngModel)]="passwordForm.confirmPassword" required minlength="8" placeholder="Confirmar contraseña">
          </div>
        </div>
        
        <div class="security-hints">
          <p class="hint-text"><app-lucide-icon name="info" [size]="14"></app-lucide-icon> Mínimo 8 caracteres. Mezcla letras y números.</p>
          <p class="hint-text"><app-lucide-icon name="shield" [size]="14"></app-lucide-icon> Al cambiar tu contraseña se cerrará la sesión en tus otros dispositivos.</p>
          <div class="error-container" *ngIf="passwordForm.newPassword && passwordForm.confirmPassword && passwordForm.newPassword !== passwordForm.confirmPassword">
            <small class="error-text fade-in"><app-lucide-icon name="alert-circle" [size]="12"></app-lucide-icon> Las contraseñas no coinciden</small>
          </div>
        </div>

        <div class="footer-actions mt-3">
          <button type="submit" class="btn-primary-block" [disabled]="!pwdForm.form.valid || isSubmitting || passwordForm.newPassword !== passwordForm.confirmPassword">
            <span *ngIf="isSubmitting" class="spinner-mini"></span>
            <span *ngIf="!isSubmitting">Actualizar Contraseña</span>
          </button>
        </div>
      </form>

    </div>
  </div>

  <!-- TOAST NOTIFICATIONS -->
  <div class="toast-message-premium" [class.show]="showToast">
    <div class="toast-content-wrapper">
      <app-lucide-icon name="info" [size]="16" color="#07B1C9"></app-lucide-icon>
      <span class="toast-text">{{ toastMessage }}</span>
    </div>
  </div>
</div>
