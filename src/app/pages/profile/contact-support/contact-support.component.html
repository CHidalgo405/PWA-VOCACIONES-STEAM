<div class="page-container">
  <app-header title="Contactar Soporte" [showBack]="true" backRoute="/profile"></app-header>

  <div class="page-content">
    <div class="manage-profile-wrapper">
      
      <div class="form-section">
        <h3 class="section-title">Nuevo Ticket de Soporte</h3>
        <form (ngSubmit)="submitTicket()" #contactForm="ngForm">
          
          <div class="ios-form-group">
            
            <div class="ios-input-row border-bottom">
              <div class="row-icon"><app-lucide-icon name="list" [size]="18"></app-lucide-icon></div>
              <select name="category" [(ngModel)]="contactForm.category" required>
                <option value="" disabled selected>Selecciona una categoría</option>
                <option *ngFor="let cat of categories" [value]="cat.value">{{ cat.label }}</option>
              </select>
            </div>

            <div class="ios-input-row border-bottom">
              <div class="row-icon"><app-lucide-icon name="message-square" [size]="18"></app-lucide-icon></div>
              <input type="text" name="subject" [(ngModel)]="contactForm.subject" required placeholder="Asunto breve">
            </div>

            <div class="ios-input-row" style="align-items: flex-start; padding-top: 12px; padding-bottom: 12px;">
              <div class="row-icon" style="margin-top: 2px;"><app-lucide-icon name="align-left" [size]="18"></app-lucide-icon></div>
              <textarea name="message" [(ngModel)]="contactForm.message" required placeholder="Describe tu problema con detalle..." rows="5" style="flex: 1; border: none; background: transparent; resize: none; font-size: 0.95rem; outline: none; font-family: inherit; color: var(--text-primary);"></textarea>
            </div>
          </div>

          <!-- Attachment -->
          <div class="attachment-area mt-2">
            <input type="file" #fileInput (change)="onFileSelected($event)" style="display: none;" accept="image/*, .pdf">
            <div class="attachment-btn" (click)="fileInput.click()" *ngIf="!contactForm.attachment">
              <app-lucide-icon name="paperclip" [size]="16"></app-lucide-icon>
              <span>Adjuntar archivo o captura</span>
            </div>
            <div class="attachment-preview" *ngIf="contactForm.attachment">
              <app-lucide-icon name="file" [size]="16" color="var(--steam-blue)"></app-lucide-icon>
              <span class="file-name">{{ contactForm.attachment.name }}</span>
              <button type="button" class="btn-remove-file" (click)="removeAttachment()">
                <app-lucide-icon name="x" [size]="14"></app-lucide-icon>
              </button>
            </div>
          </div>

          <div class="footer-actions mt-4">
            <button type="submit" class="btn-primary-block bg-orange" [disabled]="!contactForm.form.valid || isSubmitting">
              <app-lucide-icon name="send" [size]="18" *ngIf="!isSubmitting"></app-lucide-icon>
              <span *ngIf="isSubmitting" class="spinner-mini"></span>
              <span style="margin-left: 8px;" *ngIf="!isSubmitting">Enviar Mensaje</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Tickets Anteriores -->
      <div class="form-section mt-4" *ngIf="pastTickets.length > 0">
        <h3 class="section-title">Tickets Recientes</h3>
        <div class="tickets-list">
          <div class="ticket-card" *ngFor="let ticket of pastTickets">
            <div class="ticket-header">
              <span class="ticket-id">{{ ticket.id }}</span>
              <span class="ticket-status" [class.closed]="ticket.status === 'Cerrado'" [class.open]="ticket.status === 'Abierto'">
                {{ ticket.status }}
              </span>
            </div>
            <h4 class="ticket-subject">{{ ticket.subject }}</h4>
            <span class="ticket-date">{{ ticket.date }}</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- TOAST NOTIFICATIONS -->
  <div class="toast-message-premium" [class.show]="showToast">
    <div class="toast-content-wrapper">
      <app-lucide-icon name="info" [size]="16" color="#07B1C9"></app-lucide-icon>
      <span class="toast-text">{{ toastMessage }}</span>
    </div>
  </div>
</div>
