<div class="error-wrapper">
  <!-- Mesh Gradient Background -->
  <div class="mesh-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="content-container cascade-group">
    <!-- Visual Centerpiece -->
    <div class="visual-centerpiece cascade-item">
      <div class="glass-orb">
        <app-lucide-icon name="compass" [size]="80" class="compass-icon"></app-lucide-icon>
      </div>
    </div>

    <!-- Typography -->
    <div class="text-content cascade-item">
      <div class="error-code">404</div>
      <h1 class="title">Te has salido del mapa</h1>
      <p class="description">
        La coordenada que buscas no existe en este universo STEAM. Pero no te preocupes, siempre podemos trazar una nueva ruta.
      </p>
    </div>

    <!-- Actions -->
    <div class="actions cascade-item">
      <button class="btn btn-primary" routerLink="/dashboard">
        <app-lucide-icon name="home" [size]="20"></app-lucide-icon>
        <span>Volver a la Base</span>
      </button>
      <button class="btn btn-secondary" (click)="goBack()">
        <app-lucide-icon name="arrow-left" [size]="20"></app-lucide-icon>
        <span>Retroceder</span>
      </button>
    </div>
  </div>
</div>
