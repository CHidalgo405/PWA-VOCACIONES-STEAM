<div class="error-container">
  <!-- Mesh Gradient Backgrounds -->
  <div class="ambient-glow primary"></div>
  <div class="ambient-glow secondary"></div>

  <div class="content-wrapper">
    <div class="visual-badge">
      <app-lucide-icon name="alert-circle" [size]="16"></app-lucide-icon>
      <span>Error 404</span>
    </div>

    <h1 class="error-title">
      <span class="glitch" data-text="Página no">Página no</span>
      <span class="glitch" data-text="encontrada">encontrada</span>
    </h1>

    <p class="error-subtitle">
      La trayectoria se ha desviado. El recurso que buscas no existe en este universo o ha sido movido a otra órbita temporal.
    </p>

    <div class="actions">
      <button class="btn-primary" routerLink="/dashboard">
        <app-lucide-icon name="home" [size]="20"></app-lucide-icon>
        <span>Volver al inicio</span>
      </button>
      <button class="btn-secondary" (click)="goBack()">
        <app-lucide-icon name="arrow-left" [size]="20"></app-lucide-icon>
        <span>Regresar</span>
      </button>
    </div>
  </div>

  <div class="floating-orbit">
    <app-lucide-icon name="compass" [size]="120" color="var(--text-secondary)" [strokeWidth]="1" class="compass-icon"></app-lucide-icon>
  </div>
</div>
