<div class="error-container">
  
  <div class="visual-area">
    
    <div class="number-404">
      <span>4</span>
      <div class="zero-portal">
        <div class="portal-core"></div>
        <div class="portal-ring"></div>
      </div>
      <span>4</span>
    </div>

    <div class="floating-elements">
      <span class="elem science atom"><app-lucide-icon name="atom" [size]="32" color="var(--steam-blue)"></app-lucide-icon></span>
      <span class="elem tech code">&lt;/&gt;</span>
      <span class="elem engineering gear"><app-lucide-icon name="settings" [size]="32" color="var(--steam-orange)"></app-lucide-icon></span>
      <span class="elem arts palette"><app-lucide-icon name="palette" [size]="32" color="var(--steam-red)"></app-lucide-icon></span>
      <span class="elem math integral">∫</span>
      <span class="elem edu book"><app-lucide-icon name="book-open" [size]="32" color="var(--steam-green)"></app-lucide-icon></span>
    </div>
    
    <div class="lost-astronaut" style="display: flex; justify-content: center;"><app-lucide-icon name="rocket" [size]="100" color="var(--primary-color)"></app-lucide-icon></div>
  </div>

  <div class="text-area">
    <span class="error-badge">Error de Trayectoria</span>
    <h1>Parece que te has desviado del camino</h1>
    <p>
      La página que buscas ha entrado en una singularidad o nunca existió en este universo STEAM. No te preocupes, recalcularemos tu ruta.
    </p>

    <div class="action-buttons">
      <button class="btn-primary" routerLink="/dashboard" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
        <app-lucide-icon name="rocket" [size]="20"></app-lucide-icon> Volver al Dashboard
      </button>
      
      <button class="btn-outline" (click)="goBack()" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
        <app-lucide-icon name="arrow-left" [size]="20"></app-lucide-icon> Regresar
      </button>
    </div>
  </div>

  <div class="bg-gradient-one"></div>
  <div class="bg-gradient-two"></div>

</div>
