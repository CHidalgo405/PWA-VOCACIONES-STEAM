<div class="lab-wrapper fade-in">
  <div class="mission-header">
    <div class="badge">Misión 3</div>
    <h2>Laboratorio de Errores</h2>
    <p>Conecta los nodos del circuito para estabilizar el sistema principal.</p>
  </div>

  <div class="control-panel">
    <div class="metrics">
      <div class="metric-box">
        <app-lucide-icon name="timer" [size]="20" color="#07B1C9"></app-lucide-icon>
        <span>{{ formatTime }}</span>
      </div>
      <div class="metric-box">
        <app-lucide-icon name="mouse-pointer-click" [size]="20" color="#07B1C9"></app-lucide-icon>
        <span>{{ attempts }} Intentos</span>
      </div>
    </div>
    
    <div class="circuit-board">
      <!-- Background SVG lines -->
      <svg class="circuit-lines" width="100%" height="100%">
        <path d="M 20% 20% L 50% 50% L 80% 30%" stroke="var(--border-light)" stroke-width="4" fill="none" />
        <path d="M 50% 50% L 30% 80%" stroke="var(--border-light)" stroke-width="4" fill="none" />
        <path d="M 50% 50% L 70% 70%" stroke="var(--border-light)" stroke-width="4" fill="none" />
      </svg>
      
      <!-- Nodes -->
      <button 
        *ngFor="let node of nodes" 
        class="circuit-node" 
        [class.active]="node.active"
        [style.left]="node.x + '%'" 
        [style.top]="node.y + '%'"
        (click)="tryFixNode(node)">
        <div class="node-inner"></div>
      </button>
    </div>
    
    <div class="action-footer">
      <button class="btn-giveup" (click)="finish()">
        <app-lucide-icon name="flag" [size]="18" color="white"></app-lucide-icon>
        Rendirse / Ver resultados
      </button>
      <p class="hint">Nota: Algunos sistemas no se pueden arreglar solos.</p>
    </div>
  </div>
</div>
