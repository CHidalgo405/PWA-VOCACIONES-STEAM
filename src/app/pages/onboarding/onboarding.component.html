<div class="onboarding-container">
  
  <div class="visual-section">
    <div class="bg-shape"></div>
    <!-- Using the generic login-illustration as placeholder for the character since there isn't a new 3D graphic provided -> user said "the only thing that is going to be changed is the blue", implying reusing existing or we just use login-illustration.png which is already an avatar. -->
    <!-- Let's use login-illustration.png from public/assets -->
    <img src="assets/illustration-0.png" alt="Onboarding Illustration" class="illustration">
  </div>

  <div class="content-section">
    <div class="content-wrapper">
      <h1 class="title">Empieza tu futuro <br class="desktop-hidden"><span class="desktop-only">con vocaciones </span>STEAM</h1>
      <p class="subtitle">Encuentra tu vocación en ciencia, tecnología y más</p>
      
      <!-- Mobile Next Button -->
      <div class="mobile-actions">
        <div class="progress-ring-container" routerLink="/login">
          <div class="progress-ring"></div>
          <button class="btn-icon">
            <app-lucide-icon name="arrow-right" [size]="24" color="white"></app-lucide-icon>
          </button>
        </div>
      </div>

      <!-- Desktop Buttons -->
      <div class="desktop-actions">
        <button class="btn-primary" routerLink="/register">Registrarse</button>
        <button class="btn-outline" routerLink="/login">Iniciar Sesión</button>
      </div>
    </div>
  </div>

</div>
