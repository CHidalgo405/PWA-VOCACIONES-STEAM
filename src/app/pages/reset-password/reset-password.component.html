<div class="recovery-container">
  <div class="recovery-card">
    <div class="brand">
      <span class="letter-s">S</span>
      <span class="letter-t">T</span>
      <span class="letter-e">E</span>
      <span class="letter-a">A</span>
      <span class="letter-m">M</span>
    </div>

    <!-- MAIN FORM -->
    <h2 class="title">Restablecer Contraseña</h2>
    <p class="subtitle">Ingresa tu nueva contraseña para acceder a tu cuenta.</p>

    <form [formGroup]="resetForm" (ngSubmit)="saveNewPassword()" class="recovery-form">
        
        <!-- Password Field -->
        <div class="form-group">
          <label for="password">Nueva Contraseña</label>
          <div class="input-wrapper">
            <i class="icon-lock"></i>
            <input 
              type="password" 
              id="password" 
              formControlName="password" 
              placeholder="Minimo 8 caracteres"
              [class.error]="resetForm.get('password')?.invalid && resetForm.get('password')?.touched"
            >
          </div>
          <span class="error-msg" *ngIf="resetForm.get('password')?.errors?.['required'] && resetForm.get('password')?.touched">
            La contraseña es obligatoria.
          </span>
          <span class="error-msg" *ngIf="resetForm.get('password')?.errors?.['minlength'] && resetForm.get('password')?.touched">
            La contraseña debe tener al menos 8 caracteres.
          </span>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <div class="input-wrapper">
            <i class="icon-check"></i>
            <input 
              type="password" 
              id="confirmPassword" 
              formControlName="confirmPassword" 
              placeholder="Vuelve a escribir la contraseña"
              [class.error]="resetForm.get('confirmPassword')?.errors?.['passwordMismatch'] && resetForm.get('confirmPassword')?.touched"
            >
          </div>
          <span class="error-msg" *ngIf="resetForm.get('confirmPassword')?.errors?.['passwordMismatch'] && resetForm.get('confirmPassword')?.touched">
            Las contraseñas no coinciden.
          </span>
        </div>

        <button type="submit" class="btn-primary" [disabled]="resetForm.invalid || isLoading">
          <span *ngIf="!isLoading">Guardar Nueva Contraseña</span>
          <span *ngIf="isLoading" class="loader"></span>
        </button>
      </form>
    
  </div>
</div>
