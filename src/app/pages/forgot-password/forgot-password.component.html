<div class="auth-container">
    <div class="auth-card">

        <div class="auth-header">
            <div style="font-size: 3rem; margin-bottom: 10px;">🔐</div>
            <h2>Recuperar Contraseña</h2>
            <p>Ingresa tu correo y te enviaremos un enlace.</p>
        </div>

        <!-- Mensajes de éxito y error -->
        <div *ngIf="successMessage" class="alert alert-success">
            {{ successMessage }}
        </div>

        <div *ngIf="errorMessage" class="alert alert-error">
            {{ errorMessage }}
        </div>

        <form (ngSubmit)="onResetPassword()">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="ejemplo@estudiante.com"
                    required>
            </div>

            <button type="submit" class="btn-primary btn-block" style="margin-top: 25px;" [disabled]="loading">
                <span *ngIf="!loading">Enviar Correo</span>
                <span *ngIf="loading">Enviando...</span>
            </button>
        </form>

        <div style="text-align: center; margin-top: 30px;">
            <p style="font-size: 0.9rem; color: var(--text-muted);">
                <a routerLink="/login" class="text-link">← Volver al inicio de sesión</a>
            </p>
        </div>

    </div>
</div>
