<div class="auth-wrapper">
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  
  <div class="register-card">
    
    <!-- Imagen / Ilustración (Desktop side) -->
    <div class="register-image-side">
      <div class="arch-shape"></div>
      <img src="assets/register-illustration.png" alt="Register 3D Avatar" class="avatar-img">
    </div>

    <!-- Formulario (Main view) -->
    <div class="register-form-side">
      
      <!-- LOGO DE MARCA EXCLUSIVO PARA MÓVIL Y DESKTOP HEADER -->
      <div class="auth-brand-header">
        <img src="logo.svg" alt="STEAM Vocations Logo" class="app-brand-logo">
        <h1 class="logo-brand-title">STEAM <span class="logo-brand-sub">Vocations</span></h1>
      </div>

      <ng-container *ngIf="!isVerificationStep">
        
        <div class="form-header">
          <h2>Crea tu cuenta</h2>
          <p class="form-subtitle">Comienza tu viaje vocacional y potencia tu futuro STEAM.</p>
        </div>

        <form (ngSubmit)="onSubmit()">
          
          <div class="input-group">
            <label for="fullname">Nombre Completo</label>
            <div class="input-wrapper">
              <app-lucide-icon name="user" [size]="18" class="input-icon"></app-lucide-icon>
              <input type="text" id="fullname" name="fullname" [(ngModel)]="fullname" placeholder="Ingresa tu nombre" required>
            </div>
          </div>

          <div class="input-group">
            <label for="email">Correo Institucional / Personal</label>
            <div class="input-wrapper">
              <app-lucide-icon name="mail" [size]="18" class="input-icon"></app-lucide-icon>
              <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="correo@ejemplo.com" required>
            </div>
          </div>

          <div class="input-group">
            <label for="password">Crear Contraseña</label>
            <div class="input-wrapper">
              <app-lucide-icon name="lock" [size]="18" class="input-icon"></app-lucide-icon>
              <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password"
                placeholder="Mínimo 8 caracteres" required>
              <button type="button" class="btn-toggle-password" (click)="togglePasswordVisibility()" title="Mostrar/ocultar contraseña">
                <app-lucide-icon *ngIf="!showPassword" name="eye-off" [size]="18" class="eye-icon"></app-lucide-icon>
                <app-lucide-icon *ngIf="showPassword" name="eye" [size]="18" class="eye-icon"></app-lucide-icon>
              </button>
            </div>
          </div>

          <div class="options-row-flex">
            <label class="remember-label-checkbox">
              <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe">
              <span class="custom-checkbox-text">Recordarme</span>
            </label>
          </div>

          <button type="submit" class="premium-submit-button" [disabled]="isRegistering">
            <span *ngIf="isRegistering" class="btn-spinner"></span>
            <span *ngIf="!isRegistering">Crear mi Cuenta</span>
          </button>

          <div class="divider-text-line">
            <span>o regístrate con</span>
          </div>

          <div class="social-login-row">
            <button type="button" class="btn-google-pill" (click)="simularLoginGoogle($event)">
              <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google Logo" class="google-logo-svg">
              <span>Continuar con Google</span>
            </button>
          </div>

        </form>

        <div class="bottom-redirect-row">
          <p>¿Ya tienes cuenta? <a routerLink="/login" class="signup-redirect-link">Inicia sesión</a></p>
        </div>
      </ng-container>

      <!-- VERIFICATION STEP (OTP Verification) -->
      <ng-container *ngIf="isVerificationStep">
        <div class="form-header verify-header-layout">
          <div class="icon-pulse-badge">
            <app-lucide-icon name="mail" [size]="32" color="var(--steam-blue)"></app-lucide-icon>
          </div>
          <h2>Código de Verificación</h2>
          <p class="verify-desc-text">
            Hemos enviado un código de activación a:<br>
            <span class="highlight-email">{{ email }}</span>
          </p>
        </div>

        <div class="otp-input-container">
          <input type="text" [(ngModel)]="verificationCode" maxlength="6" class="otp-fields-input" placeholder="000000" style="text-transform: uppercase;" />
        </div>

        <button (click)="onVerifyOTP()" class="premium-submit-button" style="margin-top: 10px;" [disabled]="isVerifying">
          <span *ngIf="isVerifying" class="btn-spinner"></span>
          <span *ngIf="!isVerifying">Verificar Código</span>
        </button>

        <div class="bottom-redirect-row" style="margin-top: 24px;">
          <p>
            ¿No recibiste el correo? Revisa Spam o
            <a href="javascript:void(0)" (click)="isVerificationStep = false; password = ''; verificationCode = ''" class="signup-redirect-link">intenta registrarte otra vez</a>.
          </p>
        </div>
      </ng-container>

    </div>
  </div>
</div>
