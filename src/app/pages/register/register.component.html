<div class="auth-wrapper">
  
  <div class="register-card">
    
    <!-- Imagen / Ilustración (On left for desktop) -->
    <div class="register-image-side">
      <div class="arch-shape"></div>
      <img src="assets/images/register-illustration.png" alt="Register 3D Avatar" class="avatar-img">
      <h2 class="mobile-title">Crea tu cuenta</h2>
    </div>

    <!-- Formulario (On right for desktop) -->
    <div class="register-form-side">
      <ng-container *ngIf="!isVerificationStep">
        
        <div class="form-header desktop-title">
          <h2>Crea tu cuenta</h2>
        </div>

        <form (ngSubmit)="onSubmit()">
          
          <div class="input-group">
            <label for="fullname">Nombre Completo</label>
            <div class="input-wrapper">
              <app-lucide-icon name="user" [size]="20" class="input-icon"></app-lucide-icon>
              <input type="text" id="fullname" name="fullname" [(ngModel)]="fullname" placeholder="Tu nombre" required>
            </div>
          </div>

          <div class="input-group">
            <label for="email">Correo Institucional / Personal</label>
            <div class="input-wrapper">
              <app-lucide-icon name="mail" [size]="20" class="input-icon"></app-lucide-icon>
              <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="nombre@ejemplo.com" required>
            </div>
          </div>

          <div class="input-group">
            <label for="password">Crear Contraseña</label>
            <div class="input-wrapper">
              <app-lucide-icon name="lock" [size]="20" class="input-icon"></app-lucide-icon>
              <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password"
                placeholder="Mínimo 8 caracteres" required>
              <button type="button" class="btn-toggle-password" (click)="togglePasswordVisibility()">
                <app-lucide-icon *ngIf="!showPassword" name="eye-off" [size]="20" class="eye-icon"></app-lucide-icon>
                <app-lucide-icon *ngIf="showPassword" name="eye" [size]="20" class="eye-icon"></app-lucide-icon>
              </button>
            </div>
          </div>

          <div class="options-row" style="margin-bottom: 25px;">
            <label class="remember-label">
              <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe"> Recordarme
            </label>
          </div>

          <button type="submit" class="btn-main">
             <span>Crear mi Cuenta</span>
          </button>

          <div class="divider">
            <span>O regístrate con</span>
          </div>

          <div class="social-container">
            <button type="button" class="btn-google" (click)="simularLoginGoogle($event)">
              <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
            </button>
          </div>

        </form>

        <div class="signup-row">
          <p>¿Ya tienes cuenta? <a routerLink="/login" class="signup-link">Inicia sesión</a></p>
        </div>
      </ng-container>

      <!-- VERIFICATION STEP -->
      <ng-container *ngIf="isVerificationStep">
        <div class="form-header verify-header">
          <div class="icon-circle">
            <app-lucide-icon name="mail-check" [size]="40" color="#07B1C9"></app-lucide-icon>
          </div>
          <h2 style="font-size: 1.6rem; font-weight: 800; color: #1E293B; margin-bottom: 8px;">Código de Verificación</h2>
          <p style="color: #64748B;">
            Hemos enviado un código a:<br>
            <strong style="color: #07B1C9;">{{ email }}</strong>
          </p>
        </div>

        <div class="input-group text-center" style="margin: 25px 0;">
          <input type="text" [(ngModel)]="verificationCode" maxlength="6" class="otp-input text-center" placeholder="000000" style="text-transform: uppercase;" />
        </div>

        <button (click)="onVerifyOTP()" class="btn-main" style="margin-top: 15px;">
          <span>Verificar Código</span>
        </button>

        <div class="signup-row" style="margin-top: 20px;">
          <p>
            ¿No recibiste el correo? Revisa Spam o
            <a href="javascript:void(0)" (click)="isVerificationStep = false; password = ''; verificationCode = ''" class="signup-link">intenta registrarte otra vez</a>.
          </p>
        </div>
      </ng-container>

    </div>
  </div>
</div>
