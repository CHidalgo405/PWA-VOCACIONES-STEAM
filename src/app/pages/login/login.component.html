<div class="auth-wrapper">
  
  <div class="login-card">
    
    <!-- Imagen / Ilustración -->
    <div class="login-image-side">
      <div class="arch-shape"></div>
      <img src="assets/login-illustration.png" alt="Login 3D Avatar" class="avatar-img">
      <h2 class="mobile-title">Bienvenido de nuevo!</h2>
    </div>

    <!-- Formulario -->
    <div class="login-form-side">
      <ng-container *ngIf="!isVerificationStep">
        
        <div class="form-header desktop-title">
          <h2>Bienvenido de nuevo!</h2>
        </div>

        <form>
          <div class="input-group">
            <label for="email">Correo Electrónico</label>
            <div class="input-wrapper">
              <app-lucide-icon name="mail" [size]="20" class="input-icon"></app-lucide-icon>
              <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="email@gmail.com" required>
            </div>
          </div>

          <div class="input-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <app-lucide-icon name="lock" [size]="20" class="input-icon"></app-lucide-icon>
              <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password"
                placeholder="Ingresa tu contraseña" required>
              <button type="button" class="btn-toggle-password" (click)="togglePasswordVisibility()">
                <app-lucide-icon *ngIf="!showPassword" name="eye-off" [size]="20" class="eye-icon"></app-lucide-icon>
                <app-lucide-icon *ngIf="showPassword" name="eye" [size]="20" class="eye-icon"></app-lucide-icon>
              </button>
            </div>
          </div>

          <div class="options-row">
            <label class="remember-label">
              <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe"> Recordarme
            </label> 
          </div>
          <div class="options-row-2">
            <a routerLink="/olvide-contrasena" class="forgot-link">¿Has olvidado tu contraseña?</a>
          </div>

          <button (click)="login()" class="btn-main"
            [disabled]="isLoading || isBlocked"
            [class.btn-blocked]="isBlocked">
            <span *ngIf="isLoading" class="btn-spinner"></span>
            <span *ngIf="!isLoading && !isBlocked">Iniciar Sesión</span>
            <span *ngIf="isBlocked"><app-lucide-icon name="lock" [size]="16"></app-lucide-icon> Cuenta Bloqueada</span>
          </button>

          <div class="divider">
            <span>- o -</span>
          </div>

          <div class="social-container">
            <button type="button" class="btn-google" (click)="simularLoginGoogle($event)">
              <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
              <span>Iniciar Sesión con Google</span>
            </button>
          </div>

        </form>

        <div class="signup-row">
          <p>¿No tienes una cuenta? <a routerLink="/register" class="signup-link">Regístrate</a></p>
        </div>
      </ng-container>

      <!-- VERIFICATION STEP -->
      <ng-container *ngIf="isVerificationStep">
        <div class="form-header verify-header">
          <div class="icon-circle">
            <app-lucide-icon name="mail-check" [size]="40" color="#07B1C9"></app-lucide-icon>
          </div>
          <h2 style="font-size: 1.6rem; font-weight: 800; color: #1E293B; margin-bottom: 8px;">Código de Verificación</h2>
          <p style="color: #64748B;">
            Hemos enviado un código a:<br>
            <strong style="color: #07B1C9;">{{ email }}</strong>
          </p>
        </div>

        <div class="input-group text-center" style="margin: 25px 0;">
          <input type="text" [(ngModel)]="verificationCode" maxlength="6" class="otp-input text-center" placeholder="000000" style="text-transform: uppercase;" />
        </div>

        <button (click)="onVerifyOTP()" class="btn-main" style="margin-top: 15px;"
          [disabled]="isVerifying">
          <span *ngIf="isVerifying" class="btn-spinner"></span>
          <span *ngIf="!isVerifying">Verificar Código</span>
        </button>

        <div class="signup-row" style="margin-top: 20px;">
          <p>
            ¿No recibiste el correo? Revisa Spam o
            <a href="javascript:void(0)" (click)="isVerificationStep = false; verificationCode = ''" class="signup-link">volver al inicio</a>.
          </p>
        </div>
      </ng-container>

    </div>
  </div>
</div>
